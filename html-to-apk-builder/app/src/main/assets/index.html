<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><meta charset="utf-8"><title>BOX KUM</title>
<style>body{background:#008000;color:#fff;font-family:Arial;padding:0;margin:0}.wrap{background:#fff;color:#000;border-radius:10px;padding:12px;margin:8px}select{padding:10px;border-radius:8px;border:2px solid orange;font-size:18px;width:100%}.in{padding:12px;border-radius:8px;border:1px solid #999;font-size:16px;width:42%}.btn-y{background:#ffeb00;color:#000;padding:10px 18px;border:0;border-radius:8px;font-weight:bold}.btn-g{background:#008000;color:#fff;padding:10px 18px;border:0;border-radius:8px;font-weight:bold}.btn-b{background:#0099ff;color:#fff;padding:10px 18px;border:0;border-radius:8px;margin:4px}.btn-r{background:#ff4444;color:#fff;padding:6px 10px;border:0;border-radius:6px}table{width:100%;border-collapse:collapse;background:#fff;color:#000;margin-top:10px}th,td{border:1px solid #666;padding:8px;text-align:center;font-size:14px}th{background:#222;color:#fff}.box{width:100%;background:#111;color:#0f0;padding:10px;border-radius:6px;font-family:monospace;word-break:break-all;min-height:60px;margin-top:5px}.badge{background:#eee;padding:2px 8px;border-radius:10px;font-size:12px}.merah{background:red!important;color:#fff!important}.hijau{background:#00cc00!important;color:#fff!important}</style></head><body>
<div class="wrap">Pilih Tabel: <select id="viewSel" onchange="changeView()"></select><div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:10px"><input type="text" id="cari" placeholder="Cari..." class="in" style="width:60%"><button class="btn-b" onclick="render()">Cari</button><button class="btn-r" onclick="document.getElementById('cari').value='';render()">Reset</button></div>
<div style="background:#111;padding:10px;border-radius:10px;margin-top:10px"><div style="display:flex;gap:6px;flex-wrap:wrap"><input type="number" id="id_in" placeholder="ID" class="in"><input type="text" id="hasil_in" placeholder="HASIL 4D" class="in"><button class="btn-y" onclick="tambah()">+Tambah</button><button class="btn-g" onclick="updateData()">Update</button></div><div style="margin-top:8px"><button class="btn-b" onclick="resetID()">Update ID jadi mulai 1</button></div><hr><input type="file" id="fileIn" accept=".txt,.csv"><br><br><button class="btn-b" onclick="importFile()">Import CSV/TXT</button><div style="margin-top:8px;font-size:14px;color:#ddd">ID Dasar: <b id="minId">0</b> | Total: <b id="totalRow">0</b></div></div></div><div id="tableWrap"></div><div id="boxWrap"></div>
<script>
const daftar_view=['seninhkp','selasahkp','rabuhkp','kamishkp','jumathkp','sabtuhkp','mingguhkp','polhk','seninsdp','selasasdp','rabusdp','kamissdp','jumatsdp','sabtusdp','minggusdp','polsd','seninsgp','rabusgp','kamissgp','sabtusgp','minggusgp','seninkamissgp','rabusabtuminggusgp','polsg'];
let view=localStorage.getItem('box_view')||daftar_view[0];
function getData(v){let d=localStorage.getItem('box_'+v);return d?JSON.parse(d):[]}
function saveData(v,a){localStorage.setItem('box_'+v,JSON.stringify(a))}
function initSel(){document.getElementById('viewSel').innerHTML=daftar_view.map(v=>`<option value="${v}" ${v==view?'selected':''}>${v}</option>`).join('')}
function changeView(){view=document.getElementById('viewSel').value;localStorage.setItem('box_view',view);render()}
function sliding(s,l){s=String(s);if(s.length<l)return[s];let o=[];for(let i=0;i<=s.length-l;i++)o.push(s.substr(i,l));return o}
function getTable(){let rows=getData(view).slice().sort((a,b)=>a.id-b.id);let kum=0,en=[];for(let r of rows){let h=String(r.hasil).padStart(4,'0');let ka=kum;kum+=parseInt(r.hasil)||0;en.push({id:r.id,hasil:h,kum_awal:ka,kum_akhir:kum})}for(let i=0;i<en.length;i++){let h4=en[i].hasil,h3=h4.slice(-3),c='-';for(let j=i;j>=0;j--){let k=String(en[j].kum_akhir);if(k.indexOf(h4)!==-1){c='4D';break}if(k.indexOf(h3)!==-1)c='3D'}en[i].cocok=c}en=en.reverse();let cari=document.getElementById('cari').value.trim();if(cari)en=en.filter(r=>String(r.id).includes(cari)||String(r.hasil).includes(cari)||String(r.kum_akhir).includes(cari));return en}
function render(){initSel();let data=getTable();let all=getData(view).slice().sort((a,b)=>a.id-b.id);let minId=all.length?Math.min(...all.map(x=>x.id)):0;document.getElementById('minId').textContent=minId;document.getElementById('totalRow').textContent=all.length;let html="<table><tr><th>ID</th><th>Hasil</th><th>Kum Awal</th><th>Kum Akhir</th><th>Cocok</th><th>Hapus</th></tr>";for(let r of data){let cls=r.cocok=='4D'?'merah':r.cocok=='3D'?'hijau':'';let can=r.id==minId?`<button class='btn-r' onclick='hapus(${r.id})'>Hapus</button>`:'-';html+=`<tr class='${cls}'><td><a href='#' onclick='pilih(${r.id},"${r.hasil}");return false'><b>${r.id}</b></a></td><td>${r.hasil}</td><td>${r.kum_awal}</td><td>${r.kum_akhir}</td><td>${r.cocok}</td><td>${can}</td></tr>`}html+="</table>";document.getElementById('tableWrap').innerHTML=`<div class="wrap">${html}</div>`;let all4d=[],all3d=[],all_kum=[];for(let r of data){let k=String(r.kum_akhir);all4d=all4d.concat(sliding(k,4));all3d=all3d.concat(sliding(k,3))}all_kum=[...new Set(data.map(r=>r.kum_akhir))];all4d=[...new Set(all4d)];all3d=[...new Set(all3d)];let b="";b+=`<div class='wrap'>BOX Kum Akhir <span class='badge'>${all_kum.length}</span><textarea class='box' id='bKum'>${all_kum.join('*')}</textarea><button class='btn-b' onclick="copy('bKum')">Copy</button></div>`;b+=`<div class='wrap'>BOX 4D <span class='badge'>${all4d.length}</span><textarea class='box' id='b4d'>${all4d.join('*')}</textarea><button class='btn-b' onclick="copy('b4d')">Copy 4D</button></div>`;b+=`<div class='wrap'>BOX 3D <span class='badge'>${all3d.length}</span><textarea class='box' id='b3d'>${all3d.join('*')}</textarea><button class='btn-b' onclick="copy('b3d')">Copy 3D</button></div>`;document.getElementById('boxWrap').innerHTML=b}
function pilih(id,h){document.getElementById('id_in').value=id;document.getElementById('hasil_in').value=h}
function tambah(){let id=parseInt(document.getElementById('id_in').value),hasil=document.getElementById('hasil_in').value.replace(/[^0-9]/g,'');if(isNaN(id)||!hasil)return alert('Isi ID & HASIL');let arr=getData(view);if(arr.find(x=>x.id==id))return alert('ID ada, pakai Update');arr.push({id,hasil});saveData(view,arr);render()}
function updateData(){let id=parseInt(document.getElementById('id_in').value),hasil=document.getElementById('hasil_in').value.replace(/[^0-9]/g,'');let arr=getData(view),idx=arr.findIndex(x=>x.id==id);if(idx==-1)return alert('ID tidak ada');arr[idx].hasil=hasil;saveData(view,arr);render()}
function hapus(id){let arr=getData(view);let min=Math.min(...arr.map(x=>x.id));if(id!=min)return alert('Hanya ID terkecil bisa hapus');saveData(view,arr.filter(x=>x.id!=id));render()}
function resetID(){let arr=getData(view).slice().sort((a,b)=>a.id-b.id).map((x,i)=>({id:i+1,hasil:x.hasil}));saveData(view,arr);render()}
function importFile(){let f=document.getElementById('fileIn').files[0];if(!f)return alert('Pilih file');let r=new FileReader();r.onload=e=>{let lines=e.target.result.split(/\r?\n/),map=new Map(getData(view).map(o=>[o.id,o]));for(let line of lines){line=line.trim();if(!line)continue;let p=line.split(/[\s,;|]+/);if(p.length>=2){let id=parseInt(p[0]),hasil=p[1].replace(/[^0-9]/g,'');if(!isNaN(id)&&hasil)map.set(id,{id,hasil})}}saveData(view,Array.from(map.values()));render();alert('Import '+map.size)};r.readAsText(f)}
function copy(id){let el=document.getElementById(id);el.select();document.execCommand('copy');if(navigator.clipboard)navigator.clipboard.writeText(el.value)}
render();
</script></body></html>
